name: Agent Task
description: Create an implementation-ready task for an agent.
title: "[Task]: "
labels:
  - agent:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this template for work intended to fit in one focused PR. An agent will triage the issue before implementation and move it to `agent:ready` only when it has clear scope, verification, and an estimate of 8 issue points or less.

        1 issue point = 1 hour of expected implementation, verification, and documentation work.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this task achieve?
      placeholder: Describe the concrete result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide background, links, examples, user reports, or constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: List observable conditions that must be true for this task to be complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: affected_area
    attributes:
      label: Affected Area
      description: Which files, modules, workflows, APIs, or docs are likely involved?
      placeholder: |
        - app/
        - components/
        - lib/source/
    validations:
      required: true
  - type: textarea
    id: expected_verification
    attributes:
      label: Expected Verification
      description: What tests, commands, or manual checks should prove the work is done?
      placeholder: |
        - npm test
        - npm run typecheck
        - Manual check:
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:P0
        - priority:P1
        - priority:P2
        - priority:P3
      default: 2
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - type:feature
        - type:bug
        - type:research
        - type:refactor
        - type:docs
        - type:test
        - type:chore
      default: 0
    validations:
      required: true
  - type: dropdown
    id: issue_points
    attributes:
      label: Issue Points
      description: Estimate total implementation, verification, and documentation effort. Triage agents may mirror this with labels such as `issue-points:3`. Anything over 8 issue points should be broken into sub-issues.
      options:
        - 1 issue point
        - 2 issue points
        - 3 issue points
        - 4 issue points
        - 5 issue points
        - 6 issue points
        - 7 issue points
        - 8 issue points
        - Over 8 issue points - needs breakdown
      default: 0
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List prerequisite issues, decisions, approvals, services, credentials, or access needs.
      placeholder: |
        - None known
    validations:
      required: true
  - type: textarea
    id: security_data_impact
    attributes:
      label: Security / Data Impact
      description: Note any impact on auth, authorization, uploads, OpenAI data flow, persistence, secrets, billing, or user data.
      placeholder: |
        - No security or data impact expected
    validations:
      required: true
  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Anything else the triage or implementation agent should know.
    validations:
      required: false
